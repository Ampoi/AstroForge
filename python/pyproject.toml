[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroforge-sdk"
version = "0.1.0"
description = "Standard-library Python client for AstroForge PyLoN v1 UDP control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astroforge = ["py.typed"]
