<!doctype html><html lang="en"><meta charset="utf-8"><title>Map and flight cloud regression</title>
<style>body{margin:0;background:#07101a;color:white;font:14px system-ui}canvas{max-width:100%}pre{white-space:pre-wrap;margin:12px}</style>
<pre id="status">Checking the production solar map against the equivalent flight view…</pre>
<script type="module">
import * as THREE from 'three';
import {EarthEnvironment} from '../src/environment.ts';
import {SolarMap} from '../src/solar-map.ts';
import {EARTH_RADIUS,EARTH_SPIN} from '../src/celestial.ts';
const environment=new EarthEnvironment(),map=new SolarMap(environment,false),renderer=new THREE.WebGLRenderer();
renderer.autoClear=false;renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,1,.01,3000000),flight=new THREE.PerspectiveCamera();
const target=new THREE.WebGLRenderTarget(1,1),results=[];
const empty=new THREE.CubeTexture(Array.from({length:6},()=>new THREE.DataTexture(new Uint8Array(4),1,1)));empty.needsUpdate=true;
const atlas=environment.uniforms.cloudWeather.value;
map.updateVehicles([{id:'orbit',craft:{name:'Orbit'},position:[EARTH_RADIUS+400000,0,0],velocity:[0,7800,0],status:'flying'}],'orbit');
// Compare just the planet first. Test geometry occlusion separately below.
map.earthOrbit.visible=map.moonOrbit.visible=false;
for(const id of ['sun','moon'])map.bodies.get(id).visible=false;
for(const track of map.tracks.values())track.marker.material.visible=false;
for(const marker of map.bodyMarkers.values())marker.material.visible=false;
const check=(ok,message)=>{results.push(`${ok?'PASS':'FAIL'} ${message}`);document.querySelector('#status').textContent=results.join('\n');};
function read(){const data=new Uint8Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,data);return data;}
function drawMap(clouds){environment.uniforms.cloudWeather.value=clouds?atlas:empty;renderer.setRenderTarget(target);map.render(renderer,camera);return read();}
try{
  // Exercise rendering before the shared atlas/terrain worker has finished too.
  renderer.setSize(640,360);camera.position.set(0,40,0);camera.lookAt(0,0,0);map.render(renderer,camera);
  await environment.ready;
  for(const [width,height] of [[1280,720],[509,717]]){
    renderer.setSize(width,height);target.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix();
    for(const [focus,time] of [['earth',0],['vehicle:orbit',21600],['moon',86400],['sun',86400*91]]){
      map.updateTime(time);map.setFocus(focus);
      // Keep Earth in frame while changing the map's floating origin. This also
      // exercises Sun/Moon focus without reducing Earth to a subpixel dot.
      const earth=map.bodies.get('earth').position,spin=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),EARTH_SPIN*time);
      environment.sun.update(time);
      const observer=environment.sun.position.clone().normalize().multiplyScalar(4);
      camera.position.copy(observer).multiplyScalar(10).applyQuaternion(spin.clone().invert()).add(earth);
      camera.up.set(0,0,-1);camera.lookAt(earth);camera.updateMatrixWorld();
      const cloudy=drawMap(true),clear=drawMap(false);
      let changed=0;
      for(let i=0;i<cloudy.length;i+=4)if(Math.abs(cloudy[i]-clear[i])+Math.abs(cloudy[i+1]-clear[i+1])+Math.abs(cloudy[i+2]-clear[i+2])>25)changed++;
      check(changed/(width*height)>.015,`${width}×${height} ${focus} t=${time}: cloud pixels ${(changed/(width*height)*100).toFixed(2)}%`);
      // Independent conversion to the flight renderer's metre-based frame.
      environment.position.copy(observer);flight.position.set(0,0,0);
      flight.quaternion.copy(spin).multiply(camera.quaternion);flight.fov=camera.fov;flight.aspect=camera.aspect;
      flight.near=.05;flight.far=EARTH_RADIUS*10;flight.updateProjectionMatrix();
      environment.uniforms.cloudWeather.value=atlas;renderer.clear();
      environment.render(renderer,flight,false,new THREE.Vector3());
      const equivalent=read();let difference=0;
      for(let i=0;i<cloudy.length;i++)if(i%4!==3)difference+=Math.abs(cloudy[i]-equivalent[i]);
      const mean=difference/(width*height*3);
      check(mean<1,`${width}×${height} ${focus}: map/flight mean RGB difference ${mean.toFixed(4)}/255`);
    }
    const marker=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),new THREE.MeshBasicMaterial({color:0xff00ff,toneMapped:false}));
    map.scene.add(marker);
    const earth=map.bodies.get('earth').position,radial=camera.position.clone().sub(earth).normalize();
    for(const [name,distance,expected] of [['near',12,true],['far',-12,false]]){
      marker.position.copy(earth).addScaledVector(radial,distance);drawMap(true);
      const pixel=new Uint8Array(4);renderer.readRenderTargetPixels(target,Math.floor(width/2),Math.floor(height/2),1,1,pixel);
      const visible=pixel[0]>250&&pixel[1]<5&&pixel[2]>250;
      check(visible===expected,`${width}×${height}: ${name} geometry depth (RGBA ${[...pixel]})`);
    }
    map.scene.remove(marker);marker.geometry.dispose();marker.material.dispose();
  }
  check(renderer.info.programs.every(p=>p.diagnostics?.runnable!==false),'shaders compile');
  const error=renderer.getContext().getError();check(error===0,`WebGL error ${error}`);
  renderer.setRenderTarget(null);environment.uniforms.cloudWeather.value=atlas;map.render(renderer,camera);
  const preview=document.createElement('canvas');preview.width=renderer.domElement.width;preview.height=renderer.domElement.height;
  preview.getContext('2d').drawImage(renderer.domElement,0,0);renderer.domElement.replaceWith(preview);
}catch(error){check(false,error.stack||error.message);}
window.addEventListener('pagehide',()=>{target.dispose();empty.dispose();map.dispose();environment.dispose();renderer.dispose();});
</script></html>
