<!doctype html><html lang="en"><meta charset="utf-8"><title>PyLoN model review</title>
<style>body{margin:0;background:#17232c;color:#e2e8ed;font:14px system-ui}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px}section{background:#22313d;border-radius:10px;overflow:hidden}h2{margin:12px 16px;font-size:16px}canvas{width:100%;display:block}label{margin:20px}input{width:240px}pre{margin:20px}</style>
<label>Joint position <input id="position" type="range" min="0" max="2" value="0" step=".01"></label><main></main><pre id="result">Loading…</pre>
<script type="module">
import * as THREE from 'three';
import {makePart} from '../src/scene.ts';
import {updatePylonJoint} from '../src/pylon-models.ts';
const views=[];
for(const type of ['lidar2d','lidar3d','camera','startracker','servo','linear']){
  const section=document.createElement('section');section.innerHTML=`<h2>${type} · PyLoN</h2>`;document.querySelector('main').append(section);
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(450,300);renderer.setPixelRatio(1);renderer.setClearColor('#22313d');renderer.toneMapping=THREE.ACESFilmicToneMapping;section.append(renderer.domElement);
  const scene=new THREE.Scene(),part=makePart(type);scene.add(part);
  scene.add(new THREE.HemisphereLight(0xe8f3ff,0x607080,3));const sun=new THREE.DirectionalLight(0xffffff,4);sun.position.set(3,5,4);scene.add(sun);
  const box=new THREE.Box3().setFromObject(part),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();
  const camera=new THREE.PerspectiveCamera(34,1.5,.001,20);camera.position.copy(center).add(new THREE.Vector3(1,.7,1).normalize().multiplyScalar(size*2.1));camera.lookAt(center);
  views.push({renderer,scene,camera,part,type});renderer.render(scene,camera);
}
document.querySelector('#position').oninput=e=>{for(const {renderer,scene,camera,part} of views){updatePylonJoint(part,+e.target.value);const box=new THREE.Box3().setFromObject(part),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();camera.position.copy(center).add(new THREE.Vector3(1,.7,1).normalize().multiplyScalar(size*2.1));camera.lookAt(center);renderer.render(scene,camera);}};
document.querySelector('#result').textContent=JSON.stringify(views.map(({type,renderer})=>({type,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles})),null,2);
</script></html>
