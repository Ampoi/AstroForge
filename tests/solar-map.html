<!doctype html><html lang="ja"><meta charset="utf-8"><title>Solar map verification</title>
<style>body{margin:0;background:#050a13;color:#dbeaf4;font:13px system-ui}nav{position:absolute;z-index:2;left:20px;top:20px;display:flex;gap:12px;align-items:center;padding:12px;background:#142737dd;border-radius:6px}button,select{padding:7px;background:#203b4d;color:white;border:1px solid #547484}#scene{height:100vh}#status{position:absolute;bottom:18px;left:20px}</style>
<nav><strong>公転・自転・数値積分軌道</strong><select id="focus"><option value="earth">地球</option><option value="moon">月</option><option value="sun">太陽・地球の公転</option><option value="vehicle:orbit">周回機</option><option value="vehicle:lunar">月周回機</option></select><button id="day">1日進める</button><button id="month">1か月進める</button><button id="year">1/4年進める</button><button id="reset">初期時刻</button></nav><div id="scene"></div><div id="status">Loading</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SolarMap} from '../src/solar-map.ts';
import {EarthEnvironment} from '../src/environment.ts';
import {EARTH_RADIUS,EARTH_YEAR,MOON_MONTH,MOON_RADIUS,moonRelativePosition} from '../shared/solar-system.ts';
import {EARTH_MU,MOON_MU} from '../shared/nbody-orbit.ts';
import {add,mul,sub,unit,cross} from '../shared/math.ts';
const environment=new EarthEnvironment(),map=new SolarMap(environment),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
document.querySelector('#scene').append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,3000000);camera.up.set(0,0,-1);
const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.minDistance=3;controls.maxDistance=1500000;
let time=0,vehicles=[];
function update(){
 const r=EARTH_RADIUS+500000,moon=moonRelativePosition(time),radial=unit(moon),tangent=unit(cross([0,0,1],radial)),mv=mul(sub(moonRelativePosition(time+1),moonRelativePosition(time-1)),.5);
 vehicles=[{id:'orbit',craft:{name:'周回機'},status:'flying',position:[r,0,0],velocity:[0,Math.sqrt(EARTH_MU/r),0],time},
 {id:'lunar',craft:{name:'月周回機'},status:'flying',position:add(moon,mul(radial,MOON_RADIUS+300000)),velocity:add(mv,mul(tangent,Math.sqrt(MOON_MU/(MOON_RADIUS+300000)))),time}];
 map.updateVehicles(vehicles,'orbit');map.updateTime(time);map.requestPredictions(vehicles,performance.now()+time*1000);
}
function fit(){map.setFocus(document.querySelector('#focus').value);camera.position.copy(map.fitDirection().multiplyScalar(map.fitRadius()*5));controls.target.set(0,0,0);controls.update();}
document.querySelector('#focus').onchange=fit;
for(const [id,dt] of [['day',86400],['month',MOON_MONTH],['year',EARTH_YEAR/4]])document.getElementById(id).onclick=()=>{time+=dt;update();fit();};
document.querySelector('#reset').onclick=()=>{time=0;update();fit();};
update();fit();
function animate(now){requestAnimationFrame(animate);controls.update();camera.near=Math.max(.005,camera.position.length()/100000);camera.updateProjectionMatrix();map.render(renderer,camera);
 const paths=[...map.tracks.values()].filter(t=>t.orbit.visible).length;
 document.querySelector('#status').textContent=`Day ${(time/86400).toFixed(2)} · 軌道 ${paths}/2 · ${renderer.info.programs.every(p=>p.diagnostics?.runnable!==false)?'Shaders OK':'SHADER FAILED'}`;
}
requestAnimationFrame(animate);await environment.ready;
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
window.addEventListener('pagehide',()=>{map.dispose();environment.dispose();renderer.dispose();});
</script></html>
