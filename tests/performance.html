<!doctype html><html lang="en"><meta charset="UTF-8"><title>Exhaust and vehicle benchmark</title>
<style>body{background:#101923;color:#eee;font:14px monospace}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap}</style>
<button id="run" disabled>Run CPU / GPU benchmark</button><pre id="results">Ready. Fixed 960×540, DPR 1; 12 warmup + 30 samples per case. CPU update and GPU draw are measured separately. Atmosphere excluded; shadows and transparent exhaust included.</pre><div id="canvas"></div>
<script type="module">
import * as THREE from 'three';
import {ExhaustEffect,ExhaustFlow} from '../src/exhaust.ts';
import {WasmExhaustFlow,loadExhaustKernel} from '../src/exhaust-kernel.ts';
import {makePart} from '../src/scene.ts';
import {starterCraft,layoutCraft} from '../shared/craft.ts';
const module=await loadExhaustKernel();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(960,540);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;
document.querySelector('#canvas').append(renderer.domElement);
const gl=renderer.getContext(),timer=gl.getExtension('EXT_disjoint_timer_query_webgl2');
const next=()=>new Promise(r=>requestAnimationFrame(r));
const median=a=>a.toSorted((a,b)=>a-b)[Math.floor(a.length/2)];
const results=document.querySelector('#results');
document.querySelector('#run').onclick=async()=>{
  document.querySelector('#run').disabled=true;const rows=[];
  try{
    for(const [parts,vessels] of [[13,1],[80,1],[13,12]])for(const backend of ['js','wasm']){
      const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,960/540,.1,500);
      camera.position.set(25,20,38);camera.lookAt(0,5,0);
      scene.add(new THREE.HemisphereLight(0xffffff,0x303040,2));
      const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(15,35,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
      Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:100});scene.add(sun);
      const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x35454d}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
      const craft=starterCraft();while(craft.parts.length<parts)craft.parts.splice(1,0,{id:`battery_${craft.parts.length}`,type:'battery'});
      const layout=layoutCraft(craft),effects=[],frames=[];
      for(let n=0;n<vessels;n++){
        const group=new THREE.Group();group.position.set((n%4)*5-7,0,Math.floor(n/4)*6);scene.add(group);
        for(const p of layout){const model=makePart(p.type,backend==='wasm');model.position.set(-p.position[1],p.position[0]+2,p.position[2]);if(p.def.radial)model.rotation.y=p.angle+Math.PI;group.add(model);}
        const effect=new ExhaustEffect();await Promise.resolve();effect.flow=backend==='wasm'?new WasmExhaustFlow(module):new ExhaustFlow();group.add(effect.mesh);effects.push(effect);
        const v=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
        frames.push({origin:v(),airVelocity:v(2),up:v(0,1),groundHeight:0,density:1,
          emitters:[{position:v(0,2),direction:v(0,-1),velocity:v(),throttle:1},{position:v(.5,2),direction:v(0,-1),velocity:v(),throttle:1}],
          obstacles:layout.filter(p=>!p.def.radial).map(p=>({start:v(0,p.position[0]+1.8),end:v(0,p.position[0]+2.2),radius:.6}))});
        for(let i=0;i<120;i++)effect.flow.step(1/120,frames[n]);
      }
      const cpu=[],gpu=[];let calls=0,triangles=0;
      for(let i=0;i<42;i++){
        await next();if(gl.isContextLost())throw Error('WebGL context lost');
        const start=performance.now();effects.forEach((e,n)=>e.update(1/60,frames[n],camera));const update=performance.now()-start;
        const query=timer?gl.createQuery():null;if(query)gl.beginQuery(timer.TIME_ELAPSED_EXT,query);
        renderer.render(scene,camera);if(query){gl.endQuery(timer.TIME_ELAPSED_EXT);gl.flush();}
        if(renderer.info.programs.some(p=>p.diagnostics?.runnable===false))throw Error('Shader compilation failed');
        if(i>=12){cpu.push(update);calls=renderer.info.render.calls;triangles=renderer.info.render.triangles;}
        if(query){let polls=0;while(!gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE)){if(++polls>180)throw Error('GPU timer timeout');await next();}
          if(gl.getParameter(timer.GPU_DISJOINT_EXT))throw Error('GPU timer disjoint');if(i>=12)gpu.push(gl.getQueryParameter(query,gl.QUERY_RESULT)/1e6);gl.deleteQuery(query);}
      }
      rows.push({parts,vessels,backend,meshes:backend==='wasm'?'merged':'original',particles:effects[0].flow instanceof WasmExhaustFlow?effects[0].flow.count:effects[0].flow.particles.length,
        cpuMedianMs:+median(cpu).toFixed(3),cpuP95Ms:+cpu.toSorted((a,b)=>a-b)[28].toFixed(3),gpuMedianMs:gpu.length?+median(gpu).toFixed(3):null,calls,triangles});
      results.textContent=JSON.stringify({gpuTimer:!!timer,rows},null,2);
      effects.forEach(e=>e.dispose());scene.traverse(o=>{if(o instanceof THREE.Mesh)o.geometry.dispose();});sun.dispose();
    }
    results.textContent+='\nComplete';
  }catch(error){results.textContent+='\nFAILED: '+error.stack;}
  finally{document.querySelector('#run').disabled=false;}
};
document.querySelector('#run').disabled=false;
</script></html>
